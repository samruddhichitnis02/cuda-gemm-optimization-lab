<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Animation: eager PyTorch makes several memory round trips; the fused Triton kernel writes once"><title>Animation: eager PyTorch makes several memory round trips; the fused Triton kernel writes once</title>
<style>
svg{--surface:#fcfcfb;--wash:#f0efec;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.12);
--k1:#86b6ef;--k2:#5598e7;--k3:#2a78d6;--k4:#1c5cab;--ref:#a8a7a0;
--s1:#2a78d6;--s2:#eb6834;--hl:rgba(42,120,214,.22)}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--wash:#262624;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#4a4a46;--border:rgba(255,255,255,.12);
--k1:#184f95;--k2:#256abf;--k3:#3987e5;--k4:#86b6ef;--ref:#6b6a65;
--s1:#3987e5;--s2:#d95926;--hl:rgba(57,135,229,.30)}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:var(--ink2)}
.h{font-size:15px;font-weight:700}
.lbl{font-size:13px;fill:var(--ink2)}
.val{font-size:13px;font-weight:600;fill:var(--ink)}
.sm{font-size:12px;fill:var(--muted)}
.tick{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:800;fill:var(--ink)}
.bg{fill:var(--surface);stroke:var(--border)}
.wash{fill:var(--wash)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.cell{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.box{fill:var(--wash);stroke:var(--axis);stroke-width:1.5}
.track{stroke:var(--axis);stroke-width:1.5;stroke-dasharray:4 5;fill:none}
.k1{fill:var(--k1)}.k2{fill:var(--k2)}.k3{fill:var(--k3)}.k4{fill:var(--k4)}
.ref{fill:var(--ref)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}
.hl{fill:var(--hl);stroke:var(--k3);stroke-width:2}
.growx{transform-box:fill-box;transform-origin:left center;animation:growx 1.1s cubic-bezier(.2,.7,.2,1) backwards}
.growy{transform-box:fill-box;transform-origin:center bottom;animation:growy 1.1s cubic-bezier(.2,.7,.2,1) backwards}
.fade{animation:fade .6s ease-out backwards}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes eag{0%{transform:translate(0,0);opacity:1}5.0%{transform:translate(0px,0px)}16.4%{transform:translate(0px,45px)}27.9%{transform:translate(290px,45px)}39.3%{transform:translate(290px,0px)}50.7%{transform:translate(290px,45px)}62.1%{transform:translate(580px,45px)}73.6%{transform:translate(580px,0px)}85.0%{transform:translate(580px,45px)}92%{opacity:1}100%{transform:translate(580px,45px);opacity:0}}@keyframes fus{0%{transform:translate(0,0);opacity:1}5%{transform:translate(0,0)}45%{transform:translate(580px,0)}57%{transform:translate(580px,45px)}92%{opacity:1;transform:translate(580px,45px)}100%{opacity:0;transform:translate(580px,45px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" x="0.5" y="0.5" width="959" height="429" rx="14"/><text x="32.0" y="40.0" class="title" text-anchor="start" dominant-baseline="middle" >Kernel fusion: fewer round trips to memory</text><text x="32.0" y="68.0" class="sub" text-anchor="start" dominant-baseline="middle" >Computing  GELU(A × B + bias)  in two ways</text><text x="32.0" y="106.0" class="h" text-anchor="start" dominant-baseline="middle" >PyTorch eager: 3 separate kernels</text><text x="928.0" y="106.0" class="val" text-anchor="end" dominant-baseline="middle" >memory trips: 3 writes + 2 reads</text><rect class="box" x="110" y="126" width="160" height="40" rx="8"/><text x="190.0" y="146.0" class="h" text-anchor="middle" dominant-baseline="middle" >matmul</text><rect class="box" x="400" y="126" width="160" height="40" rx="8"/><text x="480.0" y="146.0" class="h" text-anchor="middle" dominant-baseline="middle" >+ bias</text><rect class="box" x="690" y="126" width="160" height="40" rx="8"/><text x="770.0" y="146.0" class="h" text-anchor="middle" dominant-baseline="middle" >GELU</text><rect x="90" y="196" width="760" height="30" rx="6" class="wash"/><text x="862.0" y="211.0" class="sm" text-anchor="start" dominant-baseline="middle" >GPU memory</text><circle cx="190.0" cy="166" r="8" class="s2" style="animation:eag 7.0s ease-in-out infinite"/><line class="grid" x1="32" x2="928" y1="250" y2="250"/><text x="32.0" y="276.0" class="h" text-anchor="start" dominant-baseline="middle" >Triton fused: 1 kernel</text><text x="928.0" y="276.0" class="val" text-anchor="end" dominant-baseline="middle" >memory trips: 1 write</text><rect class="box" x="110" y="296" width="740" height="40" rx="8"/><text x="480.0" y="316.0" class="h" text-anchor="middle" dominant-baseline="middle" >matmul  →  + bias  →  GELU     (all done in fast on-chip memory)</text><rect x="90" y="366" width="760" height="30" rx="6" class="wash"/><text x="862.0" y="381.0" class="sm" text-anchor="start" dominant-baseline="middle" >GPU memory</text><circle cx="190.0" cy="336" r="8" class="s1" style="animation:fus 7.0s ease-in-out infinite"/><text x="480.0" y="414.0" class="sm" text-anchor="middle" dominant-baseline="middle" >Each memory trip moves the whole N × N result. Fusing skips the in-between trips.</text></svg>