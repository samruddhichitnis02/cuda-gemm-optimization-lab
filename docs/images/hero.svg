<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="CUDA GEMM Optimization Lab: 5.2x faster than naive, 66% of cuBLAS, about 480x faster than one CPU core, fused Triton kernel 1.56x faster than PyTorch"><title>CUDA GEMM Optimization Lab: 5.2x faster than naive, 66% of cuBLAS, about 480x faster than one CPU core, fused Triton kernel 1.56x faster than PyTorch</title>
<style>
svg{--surface:#fcfcfb;--wash:#f0efec;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.12);
--k1:#86b6ef;--k2:#5598e7;--k3:#2a78d6;--k4:#1c5cab;--ref:#a8a7a0;
--s1:#2a78d6;--s2:#eb6834;--hl:rgba(42,120,214,.22)}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--wash:#262624;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#4a4a46;--border:rgba(255,255,255,.12);
--k1:#184f95;--k2:#256abf;--k3:#3987e5;--k4:#86b6ef;--ref:#6b6a65;
--s1:#3987e5;--s2:#d95926;--hl:rgba(57,135,229,.30)}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:var(--ink2)}
.h{font-size:15px;font-weight:700}
.lbl{font-size:13px;fill:var(--ink2)}
.val{font-size:13px;font-weight:600;fill:var(--ink)}
.sm{font-size:12px;fill:var(--muted)}
.tick{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:800;fill:var(--ink)}
.bg{fill:var(--surface);stroke:var(--border)}
.wash{fill:var(--wash)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.cell{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.box{fill:var(--wash);stroke:var(--axis);stroke-width:1.5}
.track{stroke:var(--axis);stroke-width:1.5;stroke-dasharray:4 5;fill:none}
.k1{fill:var(--k1)}.k2{fill:var(--k2)}.k3{fill:var(--k3)}.k4{fill:var(--k4)}
.ref{fill:var(--ref)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}
.hl{fill:var(--hl);stroke:var(--k3);stroke-width:2}
.growx{transform-box:fill-box;transform-origin:left center;animation:growx 1.1s cubic-bezier(.2,.7,.2,1) backwards}
.growy{transform-box:fill-box;transform-origin:center bottom;animation:growy 1.1s cubic-bezier(.2,.7,.2,1) backwards}
.fade{animation:fade .6s ease-out backwards}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" x="0.5" y="0.5" width="959" height="249" rx="14"/><text x="32.0" y="46.0" class="title" text-anchor="start" dominant-baseline="middle" style="font-size:28px">CUDA GEMM Optimization Lab</text><text x="32.0" y="80.0" class="sub" text-anchor="start" dominant-baseline="middle" >Making matrix multiplication fast on a laptop GPU (NVIDIA RTX 3060), one step at a time</text><g class="rise" style="animation-delay:0.25s"><rect x="32" y="112" width="212" height="110" rx="10" class="wash"/><rect x="32" y="112" width="5" height="110" rx="2" class="k1"/><text x="54.0" y="148.0" class="big" text-anchor="start" dominant-baseline="middle" >5.2×</text><text x="54.0" y="182.0" class="lbl" text-anchor="start" dominant-baseline="middle" >faster than my first</text><text x="54.0" y="201.0" class="lbl" text-anchor="start" dominant-baseline="middle" >GPU kernel (N = 4096)</text></g><g class="rise" style="animation-delay:0.50s"><rect x="260" y="112" width="212" height="110" rx="10" class="wash"/><rect x="260" y="112" width="5" height="110" rx="2" class="k2"/><text x="282.0" y="148.0" class="big" text-anchor="start" dominant-baseline="middle" >66%</text><text x="282.0" y="182.0" class="lbl" text-anchor="start" dominant-baseline="middle" >of NVIDIA's own cuBLAS</text><text x="282.0" y="201.0" class="lbl" text-anchor="start" dominant-baseline="middle" >library speed (N = 4096)</text></g><g class="rise" style="animation-delay:0.75s"><rect x="488" y="112" width="212" height="110" rx="10" class="wash"/><rect x="488" y="112" width="5" height="110" rx="2" class="k3"/><text x="510.0" y="148.0" class="big" text-anchor="start" dominant-baseline="middle" >~480×</text><text x="510.0" y="182.0" class="lbl" text-anchor="start" dominant-baseline="middle" >faster than one</text><text x="510.0" y="201.0" class="lbl" text-anchor="start" dominant-baseline="middle" >CPU core</text></g><g class="rise" style="animation-delay:1.00s"><rect x="716" y="112" width="212" height="110" rx="10" class="wash"/><rect x="716" y="112" width="5" height="110" rx="2" class="k4"/><text x="738.0" y="148.0" class="big" text-anchor="start" dominant-baseline="middle" >1.56×</text><text x="738.0" y="182.0" class="lbl" text-anchor="start" dominant-baseline="middle" >faster than PyTorch with</text><text x="738.0" y="201.0" class="lbl" text-anchor="start" dominant-baseline="middle" >a fused Triton kernel</text></g></svg>