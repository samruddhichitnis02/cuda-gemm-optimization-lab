<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Best kernel as percent of cuBLAS: 85% at N=1024, 51% at N=2048, 66% at N=4096"><title>Best kernel as percent of cuBLAS: 85% at N=1024, 51% at N=2048, 66% at N=4096</title>
<style>
svg{--surface:#fcfcfb;--wash:#f0efec;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.12);
--k1:#86b6ef;--k2:#5598e7;--k3:#2a78d6;--k4:#1c5cab;--ref:#a8a7a0;
--s1:#2a78d6;--s2:#eb6834;--hl:rgba(42,120,214,.22)}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--wash:#262624;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#4a4a46;--border:rgba(255,255,255,.12);
--k1:#184f95;--k2:#256abf;--k3:#3987e5;--k4:#86b6ef;--ref:#6b6a65;
--s1:#3987e5;--s2:#d95926;--hl:rgba(57,135,229,.30)}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:var(--ink2)}
.h{font-size:15px;font-weight:700}
.lbl{font-size:13px;fill:var(--ink2)}
.val{font-size:13px;font-weight:600;fill:var(--ink)}
.sm{font-size:12px;fill:var(--muted)}
.tick{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:800;fill:var(--ink)}
.bg{fill:var(--surface);stroke:var(--border)}
.wash{fill:var(--wash)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.cell{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.box{fill:var(--wash);stroke:var(--axis);stroke-width:1.5}
.track{stroke:var(--axis);stroke-width:1.5;stroke-dasharray:4 5;fill:none}
.k1{fill:var(--k1)}.k2{fill:var(--k2)}.k3{fill:var(--k3)}.k4{fill:var(--k4)}
.ref{fill:var(--ref)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}
.hl{fill:var(--hl);stroke:var(--k3);stroke-width:2}
.growx{transform-box:fill-box;transform-origin:left center;animation:growx 1.1s cubic-bezier(.2,.7,.2,1) backwards}
.growy{transform-box:fill-box;transform-origin:center bottom;animation:growy 1.1s cubic-bezier(.2,.7,.2,1) backwards}
.fade{animation:fade .6s ease-out backwards}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" x="0.5" y="0.5" width="959" height="239" rx="14"/><text x="32.0" y="40.0" class="title" text-anchor="start" dominant-baseline="middle" >How close my best kernel gets to NVIDIA's cuBLAS</text><text x="32.0" y="68.0" class="sub" text-anchor="start" dominant-baseline="middle" >My best hand-written kernel (+ float4 loads) as a share of cuBLAS speed, same session</text><text x="136.0" y="116.0" class="lbl" text-anchor="end" dominant-baseline="middle" >N = 1024</text><rect x="150" y="104" width="670" height="24" rx="5" class="wash"/><path d="M150.0,104.0 H714.5 Q719.5,104.0 719.5,109.0 V123.0 Q719.5,128.0 714.5,128.0 H150.0 Z" class="k4 growx" style="animation-delay:0.20s"/><text x="834.0" y="116.0" class="val" text-anchor="start" dominant-baseline="middle" >85%</text><text x="136.0" y="156.0" class="lbl" text-anchor="end" dominant-baseline="middle" >N = 2048</text><rect x="150" y="144" width="670" height="24" rx="5" class="wash"/><path d="M150.0,144.0 H486.7 Q491.7,144.0 491.7,149.0 V163.0 Q491.7,168.0 486.7,168.0 H150.0 Z" class="k4 growx" style="animation-delay:0.40s"/><text x="834.0" y="156.0" class="val" text-anchor="start" dominant-baseline="middle" >51%</text><text x="136.0" y="196.0" class="lbl" text-anchor="end" dominant-baseline="middle" >N = 4096</text><rect x="150" y="184" width="670" height="24" rx="5" class="wash"/><path d="M150.0,184.0 H587.2 Q592.2,184.0 592.2,189.0 V203.0 Q592.2,208.0 587.2,208.0 H150.0 Z" class="k4 growx" style="animation-delay:0.60s"/><text x="834.0" y="196.0" class="val" text-anchor="start" dominant-baseline="middle" >66%</text><line x1="820" x2="820" y1="98" y2="212" class="axis" stroke-dasharray="3 3"/><text x="820.0" y="216.0" class="sm" text-anchor="middle" dominant-baseline="middle" >100% = cuBLAS</text></svg>