<rect class="bg" x="0.5" y="0.5" width="959" height="663" rx="14"/><text x="32.0" y="40.0" class="title" text-anchor="start" dominant-baseline="middle" >Same math, smarter trips for data</text><text x="32.0" y="68.0" class="sub" text-anchor="start" dominant-baseline="middle" >The GPU can do math much faster than it can fetch numbers. Each version cuts down the waiting.</text><text x="105.0" y="100.0" class="h" text-anchor="middle" dominant-baseline="middle" >Global memory</text><text x="105.0" y="119.0" class="sm" text-anchor="middle" dominant-baseline="middle" >big but far &amp; slow</text><text x="470.0" y="100.0" class="h" text-anchor="middle" dominant-baseline="middle" >Shared memory</text><text x="470.0" y="119.0" class="sm" text-anchor="middle" dominant-baseline="middle" >small, fast, shared by a team</text><text x="830.0" y="100.0" class="h" text-anchor="middle" dominant-baseline="middle" >Thread + registers</text><text x="830.0" y="119.0" class="sm" text-anchor="middle" dominant-baseline="middle" >registers = in its hands (fastest)</text><line class="grid" x1="32" x2="928" y1="136" y2="136"/><text x="32.0" y="158.0" class="h" text-anchor="start" dominant-baseline="middle" >1 · Naive</text><text x="928.0" y="158.0" class="val" text-anchor="end" dominant-baseline="middle" >645 GFLOPS</text><text x="32.0" y="180.0" class="lbl" text-anchor="start" dominant-baseline="middle" >Each thread computes 1 answer and fetches every number from global memory itself.</text><rect class="box" x="40" y="200" width="130" height="44" rx="6"/><text x="105.0" y="222.0" class="sm" text-anchor="middle" dominant-baseline="middle" >global</text><line class="track" x1="170" x2="806" y1="222" y2="222"/><text x="470.0" y="246.0" class="sm" text-anchor="middle" dominant-baseline="middle" >(shared memory not used)</text><circle cx="830" cy="222" r="20" class="k1"/><rect class="k1" x="862" y="218" width="8" height="8" rx="1.5"/><text x="877.0" y="252.0" class="sm" text-anchor="middle" dominant-baseline="middle" >1 answer</text><g style="animation:m1 2.8s linear infinite;animation-delay:0.00s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m2 2.8s linear infinite;animation-delay:-0.23s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m3 2.8s linear infinite;animation-delay:-0.47s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m4 2.8s linear infinite;animation-delay:-0.70s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m5 2.8s linear infinite;animation-delay:-0.93s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m6 2.8s linear infinite;animation-delay:-1.17s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m7 2.8s linear infinite;animation-delay:-1.40s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m8 2.8s linear infinite;animation-delay:-1.63s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m9 2.8s linear infinite;animation-delay:-1.87s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m10 2.8s linear infinite;animation-delay:-2.10s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m11 2.8s linear infinite;animation-delay:-2.33s"><circle cx="176" cy="222" r="5" class="k1"/></g><g style="animation:m12 2.8s linear infinite;animation-delay:-2.57s"><circle cx="176" cy="222" r="5" class="k1"/></g><line class="grid" x1="32" x2="928" y1="258" y2="258"/><text x="32.0" y="280.0" class="h" text-anchor="start" dominant-baseline="middle" >2 · Shared-memory tiles</text><text x="928.0" y="280.0" class="val" text-anchor="end" dominant-baseline="middle" >970 GFLOPS</text><text x="32.0" y="302.0" class="lbl" text-anchor="start" dominant-baseline="middle" >A team copies a 32×32 tile into shared memory once, then everyone reads it from there.</text><rect class="box" x="40" y="322" width="130" height="44" rx="6"/><text x="105.0" y="344.0" class="sm" text-anchor="middle" dominant-baseline="middle" >global</text><line class="track" x1="170" x2="410" y1="344" y2="344"/><line class="track" x1="530" x2="806" y1="344" y2="344"/><rect class="box" x="410" y="322" width="120" height="44" rx="6"/><text x="470.0" y="344.0" class="sm" text-anchor="middle" dominant-baseline="middle" >shared</text><circle cx="830" cy="344" r="20" class="k2"/><rect class="k2" x="862" y="340" width="8" height="8" rx="1.5"/><text x="877.0" y="374.0" class="sm" text-anchor="middle" dominant-baseline="middle" >1 answer</text><g style="animation:m13 3.2s linear infinite;animation-delay:0.00s"><rect x="174" y="335" width="18" height="18" rx="3" class="k2"/></g><g style="animation:m14 3.2s linear infinite;animation-delay:-1.60s"><rect x="174" y="335" width="18" height="18" rx="3" class="k2"/></g><g style="animation:m15 1.6s linear infinite;animation-delay:0.00s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m16 1.6s linear infinite;animation-delay:-0.16s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m17 1.6s linear infinite;animation-delay:-0.32s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m18 1.6s linear infinite;animation-delay:-0.48s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m19 1.6s linear infinite;animation-delay:-0.64s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m20 1.6s linear infinite;animation-delay:-0.80s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m21 1.6s linear infinite;animation-delay:-0.96s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m22 1.6s linear infinite;animation-delay:-1.12s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m23 1.6s linear infinite;animation-delay:-1.28s"><circle cx="536" cy="344" r="5" class="k2"/></g><g style="animation:m24 1.6s linear infinite;animation-delay:-1.44s"><circle cx="536" cy="344" r="5" class="k2"/></g><line class="grid" x1="32" x2="928" y1="380" y2="380"/><text x="32.0" y="402.0" class="h" text-anchor="start" dominant-baseline="middle" >3 · Register tiling</text><text x="928.0" y="402.0" class="val" text-anchor="end" dominant-baseline="middle" >3,173 GFLOPS</text><text x="32.0" y="424.0" class="lbl" text-anchor="start" dominant-baseline="middle" >Each thread computes 16 answers (4×4) kept in registers, so every number it reads is reused 4 times.</text><rect class="box" x="40" y="444" width="130" height="44" rx="6"/><text x="105.0" y="466.0" class="sm" text-anchor="middle" dominant-baseline="middle" >global</text><line class="track" x1="170" x2="410" y1="466" y2="466"/><line class="track" x1="530" x2="806" y1="466" y2="466"/><rect class="box" x="410" y="444" width="120" height="44" rx="6"/><text x="470.0" y="466.0" class="sm" text-anchor="middle" dominant-baseline="middle" >shared</text><circle cx="830" cy="466" r="20" class="k3"/><rect class="k3" x="862" y="450" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="870" y="450" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="878" y="450" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="886" y="450" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="862" y="458" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="870" y="458" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="878" y="458" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="886" y="458" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="862" y="466" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="870" y="466" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="878" y="466" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="886" y="466" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="862" y="474" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="870" y="474" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="878" y="474" width="6.5" height="6.5" rx="1.5"/><rect class="k3" x="886" y="474" width="6.5" height="6.5" rx="1.5"/><text x="877.0" y="496.0" class="sm" text-anchor="middle" dominant-baseline="middle" >16 answers</text><g style="animation:m25 3.2s linear infinite;animation-delay:0.00s"><rect x="174" y="457" width="18" height="18" rx="3" class="k3"/></g><g style="animation:m26 3.2s linear infinite;animation-delay:-1.60s"><rect x="174" y="457" width="18" height="18" rx="3" class="k3"/></g><g style="animation:m27 1.6s linear infinite;animation-delay:0.00s"><circle cx="536" cy="466" r="5" class="k3"/></g><g style="animation:m28 1.6s linear infinite;animation-delay:-0.53s"><circle cx="536" cy="466" r="5" class="k3"/></g><g style="animation:m29 1.6s linear infinite;animation-delay:-1.07s"><circle cx="536" cy="466" r="5" class="k3"/></g><line class="grid" x1="32" x2="928" y1="502" y2="502"/><text x="32.0" y="524.0" class="h" text-anchor="start" dominant-baseline="middle" >4 · + float4 loads</text><text x="928.0" y="524.0" class="val" text-anchor="end" dominant-baseline="middle" >3,375 GFLOPS</text><text x="32.0" y="546.0" class="lbl" text-anchor="start" dominant-baseline="middle" >Same plan, but numbers are grabbed 4 at a time: 5 → 2 load instructions per step.</text><rect class="box" x="40" y="566" width="130" height="44" rx="6"/><text x="105.0" y="588.0" class="sm" text-anchor="middle" dominant-baseline="middle" >global</text><line class="track" x1="170" x2="410" y1="588" y2="588"/><line class="track" x1="530" x2="806" y1="588" y2="588"/><rect class="box" x="410" y="566" width="120" height="44" rx="6"/><text x="470.0" y="588.0" class="sm" text-anchor="middle" dominant-baseline="middle" >shared</text><circle cx="830" cy="588" r="20" class="k4"/><rect class="k4" x="862" y="572" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="870" y="572" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="878" y="572" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="886" y="572" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="862" y="580" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="870" y="580" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="878" y="580" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="886" y="580" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="862" y="588" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="870" y="588" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="878" y="588" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="886" y="588" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="862" y="596" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="870" y="596" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="878" y="596" width="6.5" height="6.5" rx="1.5"/><rect class="k4" x="886" y="596" width="6.5" height="6.5" rx="1.5"/><text x="877.0" y="618.0" class="sm" text-anchor="middle" dominant-baseline="middle" >16 answers</text><g style="animation:m30 3.2s linear infinite;animation-delay:0.00s"><rect x="174" y="579" width="18" height="18" rx="3" class="k4"/></g><g style="animation:m31 3.2s linear infinite;animation-delay:-1.60s"><rect x="174" y="579" width="18" height="18" rx="3" class="k4"/></g><g style="animation:m32 1.6s linear infinite;animation-delay:0.00s"><circle cx="536" cy="583.5" r="3.6" class="k4"/><circle cx="545" cy="583.5" r="3.6" class="k4"/><circle cx="536" cy="592.5" r="3.6" class="k4"/><circle cx="545" cy="592.5" r="3.6" class="k4"/></g><g style="animation:m33 1.6s linear infinite;animation-delay:-0.80s"><circle cx="536" cy="583.5" r="3.6" class="k4"/><circle cx="545" cy="583.5" r="3.6" class="k4"/><circle cx="536" cy="592.5" r="3.6" class="k4"/><circle cx="545" cy="592.5" r="3.6" class="k4"/></g><text x="480.0" y="642.0" class="sm" text-anchor="middle" dominant-baseline="middle" >Dots = numbers moving. Fewer, shorter trips → threads spend more time doing math. Speeds measured at N = 4096.</text></svg>